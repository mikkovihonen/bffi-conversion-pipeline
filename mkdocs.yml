site_name: BFFI conversion pipeline
site_url: https://mikkovihonen.github.io/bffi-conversion-pipeline/
repo_url: https://github.com/mikkovihonen/bffi-conversion-pipeline
repo_name: mikkovihonen/bffi-conversion-pipeline

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  favicon: assets/apple-touch-icon.png
  logo: assets/mark-dark.svg
  icon:
    repo: fontawesome/brands/github
  apple-touch-icon: assets/apple-touch-icon.png

nav:
  - Home: index.md
  - Pipeline overview: pipeline-overview.md
  - Runbook:
      - Getting Started: getting-started.md
      - Development: development.md
      - Debugging: roundtrip-debugging.md
      - Observability: observability.md
  - Conversion documentation:
      - Pipeline: pipeline.md
      - Mapping references:
          - MARCXML to BIBFRAME: marc_to_bibframe_mapping.md
          - BIBFRAME to BFFI: bf_to_bffi_mapping.md
          - BFFI →toMARC: bffi_to_marc_mapping.md
      - Validation: validation-strategy.md
      - Vocabulary: vocabulary.md
  - Plans: plans/README.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mermaid2
