site_name: BFFI conversion pipeline
site_url: https://mikkovihonen.github.io/bffi-conversion-pipeline/
repo_url: https://github.com/mikkovihonen/bffi-conversion-pipeline
repo_name: mikkovihonen/bffi-conversion-pipeline

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  apple-touch-icon: assets/apple-touch-icon.png

nav:
  - Home: index.md
  - Mapping references:
      - MARC → BIBFRAME: marc_to_bibframe_mapping.md
      - BIBFRAME → BFFI: bf_to_bffi_mapping.md
      - BFFI → MARC: bffi_to_marc_mapping.md
  - Debugging: roundtrip-debugging.md
  - Validation: validation-strategy.md
  - Observability: observability.md
  - Plans: plans/README.md
  - Vocabulary: vocabulary.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
