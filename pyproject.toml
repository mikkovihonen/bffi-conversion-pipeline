[project]
name = "bffi-pipeline"
version = "0.2.2"
description = "MARCXML ↔ BIBFRAME ↔ BFFI conversion pipeline (pro bono for the National Library of Finland)."
license = "MIT"
authors = [{ name = "Mikko Vihonen" }]
requires-python = ">=3.14"
readme = "README.md"

dependencies = [
    "typer>=0.25",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "rdflib>=7.6",
    "pymarc>=5.3",
    "lxml>=6",
    "pyshacl>=0.31",
    "python-ulid>=3",
    "jinja2>=3.1",
    "httpx>=0.28",
    "requests>=2.33",
    # Local-only Prometheus exporter for the `bffi-pipeline serve-metrics`
    # subcommand. Pulled in only when the operator runs serve-metrics;
    # pipeline stages never import it. Outbound-telemetry-free — the
    # exporter exposes a local /metrics endpoint that the operator's own
    # Prometheus container scrapes. See docs/observability.md.
    "prometheus-client>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "coverage>=7",
    "ruff>=0.15",
    "mypy>=2",
    "types-requests",
    "lxml-stubs",
    "mkdocs-material>=1.0",
    "mkdocs-mermaid2-plugin>=1.2",  # renders ```mermaid code blocks in MkDocs docs/

]

[project.scripts]
bffi-pipeline = "bffi_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bffi_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PL"]
ignore = ["PLR0913", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "pyshacl",
    "pyshacl.*",
    "pymarc",
    "pymarc.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker services (Grafana/Prometheus)",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__:",
    "raise NotImplementedError",
]
