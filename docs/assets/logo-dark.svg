<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" role="img" aria-label="BFFI conversion pipeline">
  <defs>
    <linearGradient id="grad" x2="0" y2="100%">
      <stop offset="0" stop-color="#1a1a2e" stop-opacity="1"/>
      <stop offset="1" stop-color="#16213e" stop-opacity="1"/>
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="400" height="120" fill="url(#grad)" rx="8"/>
  
  <!-- MARCXML node -->
  <g transform="translate(50, 60)">
    <circle r="30" fill="#666" stroke="#fff" stroke-width="2"/>
    <text y="-8" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">MARC</text>
    <text y="8" text-anchor="middle" fill="#fff" font-family="monospace" font-size="8">XML</text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="90" y1="60" x2="115" y2="60" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- BIBFRAME node -->
  <g transform="translate(150, 60)">
    <circle r="30" fill="#f0c040" stroke="#fff" stroke-width="2"/>
    <text y="-8" text-anchor="middle" fill="#000" font-family="monospace" font-size="9" font-weight="bold">BIB</text>
    <text y="8" text-anchor="middle" fill="#000" font-family="monospace" font-size="8">FRAME</text>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="190" y1="60" x2="215" y2="60" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- BFFI node -->
  <g transform="translate(250, 60)">
    <circle r="30" fill="#5a5" stroke="#fff" stroke-width="2"/>
    <text y="-8" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">BFFI</text>
    <text y="8" text-anchor="middle" fill="#fff" font-family="monospace" font-size="7">v1.0</text>
  </g>
  
  <!-- Bidirectional arrows (top) -->
  <line x1="90" y1="20" x2="115" y2="20" stroke="#ccc" stroke-width="1.5" marker-start="url(#arrow)"/>
  <line x1="90" y1="20" x2="115" y2="20" stroke="#ccc" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <line x1="190" y1="20" x2="215" y2="20" stroke="#ccc" stroke-width="1.5" marker-start="url(#arrow)"/>
  <line x1="190" y1="20" x2="215" y2="20" stroke="#ccc" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Title -->
  <text x="200" y="105" text-anchor="middle" fill="#e0e0e0" font-family="sans-serif" font-size="14" font-weight="bold">BFFI conversion pipeline</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aaa"/>
    </marker>
  </defs>
</svg>
