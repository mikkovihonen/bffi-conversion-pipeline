<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" role="img" aria-label="BFFI conversion pipeline">
  <defs>
    <style>
      .bg-light { fill: #f5f5f5; }
      .bg-dark { fill: #1a1a2e; }
      .text-light { fill: #333; }
      .text-dark { fill: #e0e0e0; }
      @media (prefers-color-scheme: dark) {
        .bg-light { display: none; }
        .text-light { display: none; }
        .bg-dark { display: block; }
        .text-dark { display: block; }
      }
      @media (prefers-color-scheme: light) {
        .bg-dark { display: none; }
        .text-dark { display: none; }
        .bg-light { display: block; }
        .text-light { display: block; }
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg-light" width="400" height="120" rx="8" fill="#f5f5f5"/>
  <rect class="bg-dark" width="400" height="120" rx="8" fill="#1a1a2e"/>
  
  <!-- MARCXML node -->
  <g transform="translate(50, 60)">
    <circle r="30" fill="#555" stroke="#fff" stroke-width="2"/>
    <text y="-8" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">MARC</text>
    <text y="8" text-anchor="middle" fill="#fff" font-family="monospace" font-size="8">XML</text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="90" y1="60" x2="115" y2="60" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- BIBFRAME node -->
  <g transform="translate(150, 60)">
    <circle r="30" fill="#dfb317" stroke="#fff" stroke-width="2"/>
    <text y="-8" text-anchor="middle" fill="#000" font-family="monospace" font-size="9" font-weight="bold">BIB</text>
    <text y="8" text-anchor="middle" fill="#000" font-family="monospace" font-size="8">FRAME</text>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="190" y1="60" x2="215" y2="60" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- BFFI node -->
  <g transform="translate(250, 60)">
    <circle r="30" fill="#4c1" stroke="#fff" stroke-width="2"/>
    <text y="-8" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">BFFI</text>
    <text y="8" text-anchor="middle" fill="#fff" font-family="monospace" font-size="7">v1.0</text>
  </g>
  
  <!-- Bidirectional arrows (top) -->
  <line x1="90" y1="20" x2="115" y2="20" stroke="#aaa" stroke-width="1.5" marker-start="url(#arrow)"/>
  <line x1="90" y1="20" x2="115" y2="20" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <line x1="190" y1="20" x2="215" y2="20" stroke="#aaa" stroke-width="1.5" marker-start="url(#arrow)"/>
  <line x1="190" y1="20" x2="215" y2="20" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Title -->
  <text class="text-light" x="200" y="105" text-anchor="middle" fill="#333" font-family="sans-serif" font-size="14" font-weight="bold">BFFI conversion pipeline</text>
  <text class="text-dark" x="200" y="105" text-anchor="middle" fill="#e0e0e0" font-family="sans-serif" font-size="14" font-weight="bold">BFFI conversion pipeline</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>
</svg>
