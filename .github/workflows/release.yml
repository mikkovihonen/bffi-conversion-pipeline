name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: pre-release checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install xsltproc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xsltproc
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install Python toolchain
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format --check
        run: uv run ruff format --check src tests
      - name: mypy --strict
        run: uv run mypy --strict src
      - name: Generated artifacts are up to date
        run: |
          uv run bffi-pipeline regenerate-mapping-tables --check
          uv run bffi-pipeline regenerate-marc-mapping --check
          uv run bffi-pipeline regenerate-marc-to-bibframe-mapping --check
          uv run bffi-pipeline regenerate-field-coverage-corpus --check
      - name: pytest
        run: uv run pytest tests -v

  release:
    name: create release
    runs-on: ubuntu-24.04
    needs: [check]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG → version: $VERSION"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
