name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      # `xsltproc` is a hard prerequisite (see README "Prerequisites"): the
      # marc2bibframe2 stylesheets are XSLT 1.0 and run as a subprocess.
      # macOS ships it, so this only bites on the Linux runner.
      - name: Install xsltproc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xsltproc
      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install Python toolchain
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format --check
        run: uv run ruff format --check src tests
      - name: mypy --strict
        run: uv run mypy --strict src
      # The whole suite, matching `make test`. Every test is a unit test
      # against on-disk fixtures — no Docker services, no network, no
      # triple store. If a test ever needs one, it gets the `integration`
      # marker and its own job here.
      - name: pytest
        run: uv run pytest tests -v
