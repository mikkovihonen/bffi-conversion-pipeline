name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      # `xsltproc` is a hard prerequisite (see README "Prerequisites"): the
      # marc2bibframe2 stylesheets are XSLT 1.0 and run as a subprocess.
      # macOS ships it, so this only bites on the Linux runner.
      - name: Install xsltproc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xsltproc
      # setup-uv stopped publishing floating major tags at v8, so this pin is
      # an exact version and has to be bumped by hand.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install Python toolchain
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format --check
        run: uv run ruff format --check src tests
      - name: mypy --strict
        run: uv run mypy --strict src
      # The three mapping docs and the field-coverage corpus are generated
      # from code, not hand-maintained. Verify the committed copies still
      # match what the generators emit; never rewrite them here — the docs
      # are the artifacts NLF reviews, so drift gets surfaced, not silently
      # papered over. pytest also guards the docs, but a dedicated step
      # names the fix.
      #
      # The corpus check is the one that catches a `third_party/
      # marc2bibframe2` submodule bump: the probes are built from the XSLT's
      # field surface, so a stylesheet that starts or stops handling a tag
      # fails here until the corpus is regenerated.
      - name: Generated artifacts are up to date
        run: |
          uv run bffi-pipeline regenerate-mapping-tables --check
          uv run bffi-pipeline regenerate-marc-mapping --check
          uv run bffi-pipeline regenerate-marc-to-bibframe-mapping --check
          uv run bffi-pipeline regenerate-field-coverage-corpus --check
      # The whole suite, matching `make test`. Every test is a unit test
      # against on-disk fixtures — no Docker services, no network, no
      # triple store. If a test ever needs one, it gets the `integration`
      # marker and its own job here.
      - name: pytest
        run: uv run pytest tests -v

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-test]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install xsltproc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xsltproc
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install Python toolchain
        run: uv sync --frozen
      - name: Run pytest with coverage
        run: |
          uv run pytest tests \
            --cov=src/bffi_pipeline \
            --cov-report=xml \
            --cov-report=term-missing
        env:
          PYTHONPATH: src
      - name: Generate coverage badge
        run: uv run python .github/scripts/generate_coverage_badge.py
      - name: Commit and push badge
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add docs/assets/coverage.svg
          git diff --cached --quiet || git commit -m "ci: update coverage badge"
          git push origin main
